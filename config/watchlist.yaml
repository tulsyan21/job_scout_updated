# Watchlist — company fit is judged HERE, once, by Ayushi. The agent never re-litigates
# whether a company belongs; it only scores roles within approved companies.
#
# Schema per company:
#   name:            display name
#   ats:             greenhouse | lever | ashby | custom
#   token:           ATS board token (verify with: python3 src/fetch.py --verify)
#   verified:        set true only after --verify succeeds
#   tier:            A (big-tech AI org) | B (AI-native, voice/vernacular) | C (AI-native horizontal)
#   rhythm_verdict:  pass | fail | unknown   (fail = gated out entirely)
#   why:             one line — why this company is on the list
#   notes:           anything else (funding status, red flags, contacts)
#
# ALL TOKENS BELOW ARE GUESSES. First task in Claude Code: run --verify, fix or remove.
# Big tech (tier A) mostly uses custom ATS — fetch.py skips those; CLAUDE.md's bounded
# web-sweep covers them weekly instead.

